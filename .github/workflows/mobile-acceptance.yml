name: NCD mobile acceptance
on:
  push:
    branches: [qa/ncd-mobile-acceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python verify.py
      - name: Save screenshots and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncd-mobile-evidence
          path: ncd-mobile-*/
          if-no-files-found: warn
