name: NCD v3.1 WCAG incomplete and reflow audit
on:
  push:
    branches: [fix/ncd-mobile-responsive-20261120]
    paths:
      - 'qa/audit_wcag_incomplete_v31.py'
      - '.github/workflows/ncd-v31-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium webkit
          npm install --no-save --ignore-scripts --no-audit --no-fund axe-core@4.10.3
      - name: Start local no-deploy server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/ncd-v31.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/ >/dev/null
      - name: Measure incomplete accessibility cases and reflow proxy
        id: audit
        continue-on-error: true
        run: python qa/audit_wcag_incomplete_v31.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncd-v31-manual-closure-evidence
          path: qa-v31-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce evidence generation
        if: steps.audit.outcome != 'success'
        run: exit 1
