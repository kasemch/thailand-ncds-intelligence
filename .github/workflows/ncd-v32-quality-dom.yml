name: NCD v3.2 quality DOM diagnosis
on:
  push:
    branches: [fix/ncd-mobile-responsive-20261120]
    paths:
      - 'qa/diagnose_quality_v32.py'
      - '.github/workflows/ncd-v32-quality-dom.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Browser and local source
        run: |
          python -m pip install 'playwright==1.58.0'
          python qa/apply_reflow_fix_v32.py
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/v32-diag.log 2>&1 &
          sleep 2
      - name: Measure quality layout offenders
        run: python qa/diagnose_quality_v32.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-dom-offenders
          path: qa-v32-diagnostic/
          if-no-files-found: warn
